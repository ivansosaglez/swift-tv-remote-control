name: SmartTVRemote
options:
  bundleIdPrefix: com.ivansosa
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  SmartTVRemote:
    type: application
    platform: iOS
    sources:
      - path: SmartTVRemote/Sources
      - path: SmartTVRemote/Resources
    info:
      path: SmartTVRemote/Info.plist
      properties:
        CFBundleDisplayName: Smart TV Remote
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Smart TV Remote usa la red local para encontrar tu Android TV / Google TV y enviarle los comandos del mando."
        NSBonjourServices: ["_androidtvremote2._tcp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivansosa.smarttvremote
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
